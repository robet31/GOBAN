name: CI

# WRAPPER SPESIFIK PROJECT GOBAN — tipis aja.
# Kerjaan beratnya (format/analyze/test) tinggal manggil template global
# reusable-flutter-check.yml. File ini cuma ngatur:
# KAPAN jalan (trigger branch) + pakai setting apa (input).
#
# Kalau nanti bikin project Flutter lain: copy file ini, ganti branch-nya,
# template global-nya tetap sama -> flow konsisten antar project.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Flutter Check
    uses: ./.github/workflows/reusable-flutter-check.yml
    with:
      flutter-channel: stable
      run-tests: true
