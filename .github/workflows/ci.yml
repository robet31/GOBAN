name: CI

# Check otomatis tiap push ke main/develop + tiap PR ke main/develop.
# Tujuannya NGECEK doang (bukan benerin): format, analyze, test.
# Kalau merah -> PR jangan di-merge, benerin dulu di lokal.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format · Analyze · Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # File .env asli tidak di-commit (ada di .gitignore) tapi pubspec
      # mendaftarkannya sebagai asset, jadi tanpa file ini `flutter build`
      # gagal. Pakai dummy dari .env.example khusus buat CI.
      - name: Setup dummy .env for CI
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test
