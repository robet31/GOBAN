name: goban
description: Platform panggil teknisi & cari lokasi tambal ban / service motor.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter_skill: ^0.2.6
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

  # Navigation
  go_router: ^14.8.1

  # Database
  sqflite: ^2.4.4
  sqflite_common_ffi_web: ^1.2.0

  # Auth & Security
  flutter_secure_storage: ^9.2.4
  google_sign_in: ^6.2.2
  crypto: ^3.0.6
  uuid: ^4.5.1

  # Network
  dio: ^5.7.0
  url_launcher: ^6.3.0

  # Maps
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2

  # Storage / Image
  image_picker: ^1.1.2

  # UI Components
  google_fonts: ^6.2.1
  intl: ^0.19.0

  # Environment
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/logo.png
